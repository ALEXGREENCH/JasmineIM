plugins {
    id 'com.android.application'
}

android {
    // Run with -PlegacyApiCheck to gate API compatibility without suppressing
    // the project's other lint findings in normal lint runs.
    lint {
        if (project.hasProperty('legacyApiCheck')) {
            checkOnly 'NewApi'
        }
    }
    //noinspection GradleDependency
    compileSdk 32

    androidResources {
        // Required for installation on Android 11+ with targetSdk >= 30,
        // even though minSdk also enables the pre-Android-2.0 resource path.
        noCompress += ['arsc']
    }

    defaultConfig {
        applicationId "ru.ivansuper.jasmin"
        minSdk 4
        //noinspection ExpiredTargetSdkVersion
        targetSdk 32
        versionCode 30
        versionName "5.5.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        useLibrary 'org.apache.http.legacy'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'ru.ivansuper.jasmin'
}

dependencies {
    // The former Jasmine_BLOB is now compiled from src/main/java.
}

apply from: rootProject.file('gradle/legacy-resources.gradle')

