plugins {
    id 'com.android.application'
}

// Internal build number for telling builds apart: build-number.txt in the project root,
// raised by one on every run that assembles, installs or bundles, and put in the APK name,
// e.g. app-debug-5.5.3-b12.apk. A sync or a clean leaves it alone.
def buildNumberFile = rootProject.file('build-number.txt')
def buildNumber = buildNumberFile.exists() ? buildNumberFile.text.trim().toInteger() : 0
if (gradle.startParameter.taskNames.any { def t = it.toLowerCase(); t.contains('assemble') || t.contains('install') || t.contains('bundle') }) {
    buildNumber++
    buildNumberFile.text = buildNumber.toString()
}

android {
    // Run with -PlegacyApiCheck to gate API compatibility without suppressing
    // the project's other lint findings in normal lint runs.
    lint {
        if (project.hasProperty('legacyApiCheck')) {
            checkOnly 'NewApi'
        }
    }
    //noinspection GradleDependency
    compileSdk 32

    androidResources {
        // Required for installation on Android 11+ with targetSdk >= 30,
        // even though minSdk also enables the pre-Android-2.0 resource path.
        noCompress += ['arsc']
    }

    defaultConfig {
        applicationId "ru.ivansuper.jasmin"
        minSdk 4
        //noinspection ExpiredTargetSdkVersion
        targetSdk 32
        versionCode 30
        versionName "5.5.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        useLibrary 'org.apache.http.legacy'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'ru.ivansuper.jasmin'

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "app-${variant.name}-${variant.versionName}-b${buildNumber}${variant.signingConfig == null ? '-unsigned' : ''}.apk"
        }
        // AGP empties outputs/apk/<variant> on every build; every APK is kept in builds/ as well
        variant.assembleProvider.configure { t ->
            t.doLast {
                variant.outputs.each { o ->
                    project.copy {
                        from o.outputFile
                        into rootProject.file('builds')
                    }
                }
            }
        }
    }
}

dependencies {
    // The former Jasmine_BLOB is now compiled from src/main/java.
}

apply from: rootProject.file('gradle/legacy-resources.gradle')

