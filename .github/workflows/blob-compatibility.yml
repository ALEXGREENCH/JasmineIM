name: Recovered source compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python compatibility/run.py --core-only --self-test
      - run: python compatibility/check_ui.py
      - run: python compatibility/check_alerts.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-diagnostics-${{ matrix.java }}
          path: build/compatibility/

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-32' 'build-tools;34.0.0'
      - run: bash gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - run: bash gradlew :app:lintDebug -PlegacyApiCheck --console=plain
      - run: python compatibility/check_android_api.py --self-test
      - run: python compatibility/check_resources.py
      - run: python compatibility/check_api.py
      - run: python compatibility/run.py --extended --self-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: application-diagnostics
          path: build/compatibility/
